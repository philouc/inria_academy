[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inria_academy"
version = "0.1.0"
description = "Inria Academy — training on advanced signal processing methods"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "CC-BY-NC-ND-4.0" }
authors = [
    { name = "Philippe Ciuciu", email = "philippe.ciuciu@inria.fr" },
]
keywords = [
    "signal processing",
    "time-frequency analysis",
    "wavelets",
    "EMD",
    "VMD",
    "synchrosqueezing",
]

dependencies = [
    "numpy>=2.3.0",
    "scipy>=1.17.1",
    "matplotlib>=3.9",
    "EMD-signal==1.9.0",
    "PyWavelets==1.8.0",
    "ssqueezepy==0.6.6",
    "vmdpy",
    "neurokit2>=0.2.10",
    "jupyter>=1.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
docs = [
    "sphinx>=7.0",
    "furo>=2024.1",
    "myst-parser>=2.0",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.5",
    "sphinx-autobuild>=2024.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/inria_academy"]

[tool.hatch.build.targets.sdist]
include = [
    "src/inria_academy",
    "examples",
    "docs",
    "README.md",
    "LICENSE",
    "CITATION.cff",
    "mkdocs.yml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
