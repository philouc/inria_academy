site_name: Inria Academy — Advanced Signal Processing Tools
site_description: Training material for advanced signal processing methods
site_author: Philippe Ciuciu
site_url: https://philouc.github.io/inria_academy/
repo_url: https://github.com/philouc/inria_academy
repo_name: philouc/inria_academy

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - content.code.copy
    - search.suggest
    - search.highlight

plugins:
  - search
  - gallery:
      examples_dirs: examples
      gallery_dirs: docs/generated/gallery
      filename_pattern: ".*\\.py$"          # match all .py (defaults to plot_*.py)
      run_stale_examples: False
      plot_gallery: false                   # ← flip to true once you have time
      abort_on_example_error: False
      only_warn_on_example_error: True
      thumbnail_size: [400, 280]
      download_all_examples: True

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets

nav:
  - Home: index.md
  - Usage: usage.md
  - Examples: generated/gallery
  - Reference: reference.md
